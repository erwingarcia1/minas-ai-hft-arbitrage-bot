[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arb"
version = "0.1.0"
description = "Cross-exchange crypto arbitrage system. Phase 1: market data + spread observer (no order placement)."
requires-python = ">=3.11"
dependencies = [
    "websockets>=14.0",
    "aiohttp>=3.9",
    "orjson>=3.9",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "sortedcontainers>=2.4",
    "rich>=13.7",
    "prometheus-client>=0.20",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
include = ["arb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
